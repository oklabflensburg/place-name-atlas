[project]
name = "place-name-atlas"
version = "0.1.0"
description = "Selbst hostbarer Ortsnamenatlas für Deutschland"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.13.5", "pydantic-settings==2.15.0",
  "sqlmodel==0.0.48", "sqlalchemy==2.1.4", "geoalchemy2==0.20.0",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "uvicorn==0.54.0",
  "httpx==0.28.1", "ijson==3.4.0"
]
[dependency-groups]
dev = ["pytest==9.1.1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
